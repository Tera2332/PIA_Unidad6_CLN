<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazón Urbano · Gestión de pedidos</title>
  <meta name="description" content="Panel para registrar pedidos, darles seguimiento y controlar el inventario del restaurante Sazón Urbano.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2410c'/%3E%3Cpath d='M20 40c0-9 6-15 12-15s12 6 12 15zM16 44h32' stroke='white' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/interfaz/estilos.css">
</head>
<body>
  <a class="salto" href="#contenido">Saltar al contenido</a>

  <div class="app">
    <aside class="lateral">
      <div class="marca">
        <div class="marca-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16c0-5 3-8 7-8s7 3 7 8z"/><path d="M3 19h18"/><path d="M12 5V3"/></svg>
        </div>
        <div>
          <div class="marca-nombre">Sazón Urbano</div>
          <div class="marca-sub">Gestión de pedidos</div>
        </div>
      </div>

      <nav class="menu" aria-label="Secciones">
        <a href="#/inicio" data-vista="inicio"></a>
        <a href="#/nuevo" data-vista="nuevo"></a>
        <a href="#/pedidos" data-vista="pedidos"></a>
        <a href="#/inventario" data-vista="inventario"></a>
        <a href="#/historial" data-vista="historial"></a>
      </nav>

      <div class="rol">
        <label for="selector-rol">Estás trabajando como</label>
        <select id="selector-rol"></select>
        <p id="rol-ayuda" class="rol-ayuda"></p>
      </div>
    </aside>

    <main class="principal" id="contenido" tabindex="-1" aria-live="polite"></main>
  </div>

  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>
  <script src="/interfaz/app.js"></script>
</body>
</html>
