name: CI
on: [push, pull_request]

jobs:
  calidad-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Análisis estático (ruff)
        run: ruff check src tests scripts
      - name: Pruebas unitarias y de integración con cobertura mínima de 80 %
        run: pytest -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Evidencias del paquete (120 casos y 20 transiciones)
        run: python scripts/ejecutar_casos.py
      - name: Especificación OpenAPI
        run: python scripts/exportar_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: |
            coverage.xml
            evidencias/
            docs/api/openapi.json

  docker-compose:
    runs-on: ubuntu-latest
    needs: calidad-y-pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas dentro de Docker Compose contra PostgreSQL
        run: docker compose --profile tests run --rm tests
      - name: Limpieza
        if: always()
        run: docker compose down -v
