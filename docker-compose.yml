# Servicios: db (PostgreSQL), app (API) y tests (se ejecuta bajo demanda).
#   docker compose up --build                    -> base de datos + API en http://localhost:8000/docs
#   docker compose --profile tests run --rm tests -> pruebas contra PostgreSQL
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sazon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sazon}
      POSTGRES_DB: ${POSTGRES_DB:-sazon}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sazon} -d ${POSTGRES_DB:-sazon}"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sazon}:${POSTGRES_PASSWORD:-sazon}@db:5432/${POSTGRES_DB:-sazon}
      SEED_ON_START: ${SEED_ON_START:-true}
      STOCK_CRITICO: ${STOCK_CRITICO:-5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    build: .
    profiles: ["tests"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sazon}:${POSTGRES_PASSWORD:-sazon}@db:5432/sazon_test
    command: ["pytest", "--cov=src", "--cov-report=term-missing", "--cov-fail-under=80"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
