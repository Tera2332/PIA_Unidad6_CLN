# Blueprint de Render: crea la API (Docker) y su base de datos PostgreSQL.
services:
  - type: web
    name: sazon-urbano-api
    runtime: docker
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sazon-db
          property: connectionString
      - key: SEED_ON_START
        value: "true"
      - key: STOCK_CRITICO
        value: "5"
databases:
  - name: sazon-db
    plan: free
    databaseName: sazon
    user: sazon
